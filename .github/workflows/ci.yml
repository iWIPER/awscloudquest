name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Syntax, question bank and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node scripts/check-syntax.mjs
      - name: Validate question bank
        run: node scripts/validate-questions.mjs
      - name: Unit tests
        run: node --test "tests/*.test.js"

  smoke:
    name: Smoke test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        # WebKit is the engine of Safari and of every browser on iPhone.
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Smoke test (360 px and 1280 px)
        run: node scripts/smoke.mjs --browser ${{ matrix.browser }} --shots smoke-shots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots-${{ matrix.browser }}
          path: smoke-shots/
          if-no-files-found: ignore
