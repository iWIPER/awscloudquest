name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Syntax, question bank and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node scripts/check-syntax.mjs
      - name: Validate question bank
        run: node scripts/validate-questions.mjs
      - name: Unit tests
        run: node --test "tests/*.test.js"

  smoke:
    name: Headless browser smoke test
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke test (360 px and 1280 px)
        run: node scripts/smoke.mjs --shots smoke-shots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: smoke-shots/
          if-no-files-found: ignore
